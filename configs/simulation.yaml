# Simulation settings (P2). Same values for every SV regardless of label.
flank: 50000
snv_density: 0.001        # background het/hom variants per bp (SNVs + 10% short indels)
indel_frac: 0.10
zygosity: het             # main run; "hom" for sensitivity
coverage_total: [27, 33]  # per-batch diploid-total depth ~U(lo,hi); short and long drawn independently
replicates: 1
sweep:
  long_depths: [5, 10, 15, 20, 30]
  short_depths: [15, 30]
short:
  profile: HS25           # ART built-in HiSeq 2500 error profile (empirical)
  read_len: 150
  frag_mean: 400
  frag_sd: 50
  overshoot: 1.2          # simulate extra then GC-thin
  gc_mu: 0.45
  gc_sigma: 0.20
long:
  hifi:
    mu: 9.6               # lognormal; median ~ 14.8 kb
    sigma: 0.25
    min_len: 3000
    max_len: 40000
    error_rate: 0.004
    sub: 0.25
    ins: 0.35
    dele: 0.40
    qchar: "I"
  ont:
    mu: 9.6
    sigma: 0.8
    min_len: 1000
    max_len: 120000
    error_rate: 0.06
    sub: 0.40
    ins: 0.25
    dele: 0.35
    qchar: "5"
